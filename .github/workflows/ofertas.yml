name: monitor-ofertas
on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 h (UTC). Ajuste conforme o orçamento de buscas
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python buscar.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: |
          git config user.name "bot-ofertas"
          git config user.email "bot@users.noreply.github.com"
          git add -A .
          git commit -m "estado" || true
          git push
