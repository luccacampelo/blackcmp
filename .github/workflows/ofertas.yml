name: monitor-ofertas
on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python monitor.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: |
          git config user.name "bot-ofertas"
          git config user.email "bot@users.noreply.github.com"
          git add estado.json
          git commit -m "estado" || true
          git push
